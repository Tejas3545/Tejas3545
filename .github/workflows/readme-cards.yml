name: Generate README Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy card
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Tejas3545
          file: profile-assets/trophy.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: 'username=Tejas3545&show_icons=true&theme=tokyonight&hide_border=true'
          path: profile-assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: 'username=Tejas3545&layout=compact&theme=tokyonight&hide_border=true'
          path: profile-assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-assets
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "update readme cards"
            git push
          fi
